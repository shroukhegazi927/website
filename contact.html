<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-container">
            <h1 class="logo">Website</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="components.html">Components</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <section class="contact-section">
            <h2>Contact Us</h2>
            <p>Please fill out the form below with all required inputs:</p>
            
            <form class="styled-form" action="#" method="POST">
                
                <!-- 1. Text -->
                <div class="form-group">
                    <label for="full-name">1. Full Name </label>
                    <input type="text" id="full-name" name="full_name" required placeholder="Enter your full name">
                </div>

                <!-- 2. Email -->
                <div class="form-group">
                    <label for="email">2. Email </label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <!-- 3. Number -->
                <div class="form-group">
                    <label for="age">3. Age</label>
                    <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter a number">
                </div>

                <!-- 4. Date -->
                <div class="form-group">
                    <label for="visit-date">4. Date</label>
                    <input type="date" id="visit-date" name="visit_date">
                </div>

                <!-- 5. Radio Buttons -->
                <div class="form-group">
                    <label>5. Gender</label>
                    <div style="display: flex; gap: 20px; margin-top: 8px;">
                        <label class="radio-label"><input type="radio" name="usertype" value="student" checked> Female</label>
                        <label class="radio-label"><input type="radio" name="usertype" value="professional"> Male</label>
                    </div>
                </div>

                <!-- 6. Checkboxes (Interest) -->
                <div class="form-group">
                    <label>6. Interest </label>
                    <div class="checkbox-group">
                        <label class="checkbox-label"><input type="checkbox" name="interest" value="design"> Design</label>
                        <label class="checkbox-label"><input type="checkbox" name="interest" value="art"> Art</label>
                        <label class="checkbox-label"><input type="checkbox" name="interest" value="coding"> Coding</label>
                    </div>
                </div>

                <!-- 7. Dropdown Menu (Select) -->
                <div class="form-group">
                    <label for="topic">7. Country</label>
                    <select id="topic" name="topic">
                        <option value="egy">Egypt</option>
                        <option value="italy">Italy</option>
                        <option value="spain">Spain</option>
                    </select>
                </div>

                <!-- 8. Large Text Box (Textarea) -->
                <div class="form-group">
                    <label for="message">8. Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Write your detailed message here..."></textarea>
                </div>

                <button type="submit" class="btn primary-btn">Submit Form</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Teal UI System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
